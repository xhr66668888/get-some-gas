name: Refresh market data

on:
  schedule:
    # Weekdays after the NYMEX close and EIA's Monday pump-price release (~5 pm ET).
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and recalibrate
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/market.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh market data $(date -u +%Y-%m-%d)"
            git push
          fi
