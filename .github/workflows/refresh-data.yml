name: Refresh market data

# Publishes market.json to the `data` branch, which the site reads directly, so fresh
# prices reach visitors without a redeploy and without commits piling up on main.
# Full refresh (EIA history + recalibration): every push to main and each weekday evening.
# Quick refresh (latest NYMEX gasoline quote): every 30 minutes during U.S. daytime.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "*/30 12-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the keyless EIA fallback
        run: pip install xlrd==2.0.1

      - name: Start from the latest published data
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:market.json > public/data/market.json
          fi

      - name: Refresh
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 12-21 * * 1-5" ]; then
            python3 scripts/fetch_data.py --futures
          else
            python3 scripts/fetch_data.py
          fi

      - name: Publish to the data branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/public/data/market.json" .
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -q -m "Market data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
