<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>Get Some Gas — when to fill up this week</title>
    <meta name="description" content="Enter your ZIP code and see which day this week gas will be cheapest near you.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Get Some Gas — when to fill up this week">
    <meta property="og:description" content="Enter your ZIP code and see which day this week gas will be cheapest near you.">
    <meta name="theme-color" content="#0E427E">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/SmartisanCompact-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="js/app.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container nav-inner">
            <a href="./" class="logo" aria-label="Get Some Gas">
                <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect x="5" y="4" width="15" height="24" rx="3" fill="#0E427E" />
                    <rect x="8.5" y="8" width="8" height="6" rx="1.2" fill="#fff" />
                    <path d="M20 11h2.5a2 2 0 0 1 2 2v9.5a1.75 1.75 0 0 0 3.5 0V12l-3-3.5" fill="none" stroke="#62BA46"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="3" y="26" width="19" height="3" rx="1.5" fill="#0E427E" />
                </svg>
                <span class="logo-text">Get Some <span>Gas</span></span>
            </a>
            <button type="button" class="lang-toggle" id="lang-toggle" data-i18n="nav.lang">中文</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <canvas class="hero-canvas" id="hero-canvas" aria-hidden="true"></canvas>
            <div class="container narrow hero-content">
                <h1 data-i18n="hero.title">When should you fill up this week?</h1>
                <form class="zip-form" id="zip-form" novalidate>
                    <label class="visually-hidden" for="zip-input" data-i18n="hero.zipLabel">ZIP code</label>
                    <input id="zip-input" class="zip-input" name="zip" type="text" inputmode="numeric"
                        autocomplete="postal-code" maxlength="5" data-i18n-placeholder="hero.zipPlaceholder"
                        placeholder="Enter ZIP code, e.g. 92122">
                    <button type="submit" class="btn" data-i18n="hero.cta">Go</button>
                </form>
                <p class="zip-status" id="zip-status" role="status" aria-live="polite"></p>
            </div>
        </section>

        <section class="result container narrow" id="result" hidden>
            <article class="answer" aria-live="polite">
                <p class="answer-place" id="answer-place"></p>
                <p class="answer-label" data-i18n="answer.label"></p>
                <h2 class="answer-day">
                    <span class="answer-weekday" id="answer-weekday"></span>
                    <span class="answer-date" id="answer-date"></span>
                </h2>
                <p class="answer-price" id="answer-price"></p>
                <div class="answer-save">
                    <label class="gallons" for="gallons">
                        <span data-i18n="answer.fill"></span>
                        <input id="gallons" type="number" inputmode="numeric" min="1" max="999" step="1" value="15">
                        <span data-i18n="answer.gallons"></span>
                    </label>
                    <strong class="answer-amount" id="answer-save"></strong>
                </div>
            </article>

            <article class="trend">
                <h3 data-i18n="chart.title"></h3>
                <div class="chart" id="chart"></div>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        <p id="updated"></p>
    </footer>

</body>

</html>
